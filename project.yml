name: TVRemote
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: FB52TKY2U5 # ADR-0003: stable signature keeps the Local Network permission
    GENERATE_INFOPLIST_FILE: NO
targets:
  TVRemote:
    type: application
    platform: macOS
    sources: [TVRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nikita.tvremote
        INFOPLIST_FILE: TVRemote/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TVRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TVRemoteTests]
    dependencies:
      - target: TVRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
        TVRemoteTests: [test]
    test:
      targets: [TVRemoteTests]
